[build-system]
requires = ["flit_core >=3.7,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cypmode"
version = "0.1.0"
description = "Mode-aware (Type I / Type II) reinterpretation of TDC's binary CYP450 inhibition benchmarks"
authors = [{name = "Muhammad Talaat"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
# Floors match what this project is actually tested against (see
# requirements.txt's exact pins for the hosted-deployment target). rdkit is
# additionally upper-bounded: SMARTS substructure-matching behavior is
# load-bearing for cypmode/metrics/motifs.py's correctness, so a future
# major release silently changing that behavior on a plain `pip install -e .`
# is a real risk worth guarding against, not just a normal version bump.
dependencies = [
    "rdkit>=2026.3.6,<2027",
    "pandas>=3.0.5",
    "numpy>=2.5.3",
    "streamlit>=1.64.0",
    # For cypmode/data/octant_benchmark.py's Mann-Whitney U test. Was
    # already present transitively (scikit-learn, in the tdc extra, pulls
    # it in) but that's a coincidence of an unrelated extra, not something
    # this module should rely on being installed.
    "scipy>=1.18.1",
]

[project.optional-dependencies]
dev = ["pytest"]
# Needed only to reload the raw CYP panel labels (cypmode/data/panel.py);
# a local cache is checked into data/tdc_cache so most usage doesn't need it.
# PyTDC itself is deliberately NOT listed here -- install it separately with
# `pip install --no-deps PyTDC` (see README.md). PyTDC's own declared
# dependency tree pulls in cellxgene-census -> tiledbsoma, which has no
# prebuilt Windows wheel and fails building from source on CI (confirmed:
# a plain `pip install PyTDC` broke Windows CI with a tiledbsoma/CMake
# build error, while macOS/Linux passed). None of that is needed for the
# tdc.single_pred.ADME path this project actually uses -- this extra lists
# just the real runtime dependencies of that path, installed normally.
# setuptools<81 is pinned because PyTDC imports pkg_resources at import
# time, which modern setuptools no longer bundles -- confirmed directly by
# a clean install failing with ModuleNotFoundError: pkg_resources otherwise.
tdc = [
    "setuptools<81",
    "fuzzywuzzy",
    "huggingface_hub",
    "openpyxl",
    "PyYAML",
    "requests",
    "scikit-learn",
    "seaborn",
    "tqdm",
]
# Needed only for cypmode/validation/structures.py, which parses Boltz-2's
# predicted mmCIF structures for the 4 solved-structure reference compounds.
# pyKVFinder is for cypmode/validation/pocket_geometry.py's pocket-volume
# feature -- confirmed working directly despite its declared numpy<2.5.0
# upper bound conflicting with this project's own numpy>=2.5.3 floor (an
# overly conservative pin on pyKVFinder's side, not a real incompatibility
# -- verified by actually running its real workflow end to end).
validate = ["biopython", "pyKVFinder", "posebusters"]
# For cypmode/challenge/*.py -- reproducing and then extending the OpenADMET
# CYP Blind Challenge tutorial's own baseline (LightGBM on RDKit descriptors
# via useful_rdkit_utils, the same library the official tutorial uses).
# requests is for pubchem_auxiliary.py/bindingdb_auxiliary.py's targeted,
# narrowly-scoped REST pulls (a specific bioassay/target's own data, not a
# bulk multi-GB database dump). chembl_structure_pipeline is ChEMBL's own
# structure standardizer (rdkit-only dependency, confirmed lightweight) --
# used so a salt form and its free base are recognized as the same real
# compound in cross-dataset overlap checks, which plain canonical SMILES
# comparison misses (confirmed directly: ketoconazole vs ketoconazole.Cl
# canonicalize to two different strings). tblite is for
# quantum_pharmacophore.py's GFN2-xTB features -- confirmed real, working,
# and CPU-only (no GPU needed); xtb-python was considered and rejected as
# unmaintained. pmapper is for pharmacophore_fingerprint.py's 3-point
# pharmacophore fingerprints -- lightweight (rdkit + networkx only, no
# compiled numerical backend, so no OpenMP-conflict risk the way tblite
# has with LightGBM).
challenge = [
    "lightgbm",
    "useful_rdkit_utils",
    "scikit-learn",
    "requests",
    "chembl_structure_pipeline",
    "statsmodels",
    "pmapper",
    "tblite",
]
# For cypmode/challenge/multitask.py's shared-trunk model -- a small, plain
# PyTorch MLP built deliberately instead of installing openadmet-models
# (whose own real dependencies -- PyTorch, Lightning, ChemProp+CheMeleon
# weights, CatBoost, XGBoost, TabPFN, several git-installed packages --
# only exist in a separate conda env, not this project's pyproject.toml,
# and would be a large, risky addition on the 16GB machine this was
# developed on, already under real memory pressure from Boltz-2). CPU
# only -- this MLP doesn't need the GPU, and the machine's one GPU is
# already busy with Boltz-2 structural runs.
multitask = ["torch"]

[tool.pytest.ini_options]
# third_party/ vendors full clones (TDC, Boltz-2) with their own pytest
# suites and heavy-dependency imports (torch, etc.) -- scope collection to
# this project's own tests.
testpaths = ["tests"]
markers = [
    "torch: needs both the challenge and multitask extras installed together -- run with `pytest tests/test_multitask.py` as its own, separate invocation, never mixed with the rest of the suite (a plain `-m` deselect isn't enough -- pytest still imports a deselected file during collection, which is exactly what triggers this). Confirmed directly: importing torch and lightgbm in the same process crashes with a real segfault (OpenMP runtime conflict between the two libraries' bundled libomp, macOS/Apple Silicon) -- not flaky, reproduces every time.",
    "tblite: needs the challenge extra's tblite installed -- run with `pytest tests/test_quantum_pharmacophore.py` as its own, separate invocation, never mixed with the rest of the suite, for the same reason as the torch marker above: tblite's own bundled OpenMP runtime conflicts with LightGBM's once both have been loaded into one process. Confirmed directly: the full suite hangs (not a crash this time -- a real deadlock, 0% CPU, no progress) as soon as it reaches a tblite-calling test after dozens of earlier LightGBM-heavy tests; killing and re-running just tests/test_tdi_baseline.py + tests/test_quantum_pharmacophore.py together reproduces it every time.",
]
# --ignore, not just a -m deselect: pytest imports every collected file
# (including ones a marker would later deselect) to discover its tests,
# and that import alone is what crashes/hangs the process -- confirmed
# directly for both test_multitask.py (segfault) and
# test_quantum_pharmacophore.py (deadlock).
addopts = "--ignore=tests/test_multitask.py --ignore=tests/test_quantum_pharmacophore.py"
