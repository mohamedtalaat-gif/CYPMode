# Limitations. The wording is written by hand; every value comes from the audit run through `uses`.
- id: L1
  area: evaluation
  uses: [CYP3A4_stack_auc_zNone, CYP3A4_stack_auc_z1_96, CYP2D6_stack_auc_zNone, CYP2D6_stack_auc_z1_96]
  text: >-
    All performance figures are cross-validated estimates on the training data. No figure here uses the
    hidden test labels. The stack AUC changes with the scored population: CYP3A4 {CYP3A4_stack_auc_zNone} on all rows
    vs {CYP3A4_stack_auc_z1_96} on confident rows, CYP2D6 {CYP2D6_stack_auc_zNone} vs {CYP2D6_stack_auc_z1_96}.
    The leaderboard score of an entry is a separate measurement on the hidden labels, and the step from these estimates to it depends on the model (L2).
- id: L2
  area: evaluation
  uses: [CYP3A4_baseline_live_board_mcc, CYP2D6_baseline_live_board_mcc]
  text: >-
    The official baseline scores {CYP3A4_baseline_live_board_mcc} (CYP3A4) and {CYP2D6_baseline_live_board_mcc} (CYP2D6)
    on the live board, well above its cross-validated score on the same data, so cross-validation under-states
    leaderboard performance by an amount that depends on the model; the live board scores only part of the test set.
- id: L3
  area: labels
  uses: [CYP3A4_label_rule_mismatches, CYP2D6_label_rule_mismatches]
  text: >-
    The label rule was recovered from the data (mismatches: CYP3A4 {CYP3A4_label_rule_mismatches}, CYP2D6
    {CYP2D6_label_rule_mismatches}). The rule that decides which compounds count as confidently labeled in the
    official score is not published; the confidence cut-off used here is a proxy and every analysis is repeated at two cut-offs.
- id: L4
  area: uncertainty
  uses: [CYP3A4_committee_components_adding_info, CYP2D6_committee_components_adding_info]
  text: >-
    Committee disagreement adds information beyond the decision margin for {CYP3A4_committee_components_adding_info}
    components on CYP3A4 and {CYP2D6_committee_components_adding_info} on CYP2D6 under the permutation test; where the
    count is zero the committee is reported as a measured negative result and does not alter predictions.
- id: L5
  area: calibration
  uses: [CYP3A4_calibration_slope, CYP2D6_calibration_slope, CYP3A4_raw_calibration_slope, CYP2D6_raw_calibration_slope]
  text: >-
    The probabilities the final build publishes (isotonic-calibrated) have calibration slopes of {CYP3A4_calibration_slope}
    (CYP3A4) and {CYP2D6_calibration_slope} (CYP2D6) on held-out folds. The sigmoid of the regularised blend as it comes out
    is a ranking score and not a probability (slopes {CYP3A4_raw_calibration_slope} and {CYP2D6_raw_calibration_slope}); it is
    never published as one. Probabilities are calibrated to the weighted validation population, not to the unknown scored test
    population.
- id: L6
  area: structure
  uses: [structure_first_pick_rmsd]
  text: >-
    On the diverse crystal benchmark the model's first-pick pose is {structure_first_pick_rmsd} A from the crystal pose
    on average; the structure score depends on a handful of compounds and is noisy. The benchmark ligands come from the
    PDB, which co-folding models may have seen, so absolute accuracy is optimistic.
- id: L7
  area: reproducibility
  uses: [tests_passed, tests_failed]
  text: >-
    The test suite has {tests_passed} passing and {tests_failed} failing tests in this run. Multi-threaded LightGBM is
    not guaranteed bit-identical across thread counts (see the determinism section); the pipeline fixes seeds and thread
    counts, and cached predictions are checked against a fresh fit.
- id: L8
  area: repository
  uses: [git_modified, git_untracked]
  text: >-
    The working tree has {git_modified} modified and {git_untracked} untracked entries: results in this report come from
    uncommitted code until the work is committed.
- id: L9
  area: population
  uses: [population_region_points]
  text: >-
    The scored CYP2D6 set may contain many compounds the screen would never have promoted (scored as inactive). The
    selection-aware file gains AUC when they are numerous and loses both AUC and MCC when there are none, by more than
    it gains at the call rate of the final build (the table of job 016 in section 7), and neither the label-shift
    estimate nor the public metrics of the baseline identify their share ({population_region_points} grid points are
    consistent with the metrics). The live board scores half of the test set and cannot separate the two files (job 016),
    so the entry is the hits-only file and the selection-aware file is kept, with its SHA-256, to be scored on the test
    labels if the organisers publish them: that comparison measures the share and tests the hypothesis on data that no
    choice of this project touched.
- id: L10
  area: calibration
  uses: [CYP2D6_ece, CYP3A4_ece, CYP2D6_raw_ece, CYP3A4_raw_ece]
  text: >-
    The CYP2D6 blend as it comes out is close to a constant (weighted expected calibration error {CYP2D6_raw_ece} against
    {CYP3A4_raw_ece} for CYP3A4): it ranks and transfers a call rate but is not a probability. The probabilities that are
    published pass through an isotonic step fitted on inner out-of-fold scores, which brings the error to {CYP2D6_ece}
    (CYP2D6) and {CYP3A4_ece} (CYP3A4); a monotone step restores calibration and adds no discrimination.
- id: L11
  area: data
  uses: []
  text: >-
    The CYP3A4 reaction-phenotyping and inhibition release of the laboratory that measured the challenge (Octant, same compound library) contains one compound that is
    also in the blinded test set (its identifier is withheld here, because the release rule forbids naming a blinded compound in a file that would be pushed). Its measurements are excluded from every use of that release and are never read by a model or a validation; the
    other rows of the release are used only for an independent check of the motif screen and never enter a prediction.
- id: L12
  area: candidates
  uses: []
  text: >-
    Two families of Chemprop candidates were run as a staged design under a rule written beforehand, for CYP3A4 only: CheMeleon was screened on 5 folds and not continued, because
    its gain (+0.0035 AUC) was below the bar of the stage rule, and the two OpenADMET pretraining weights (MiniMol targets and the Novartis ADMET surrogate) passed the screen and were
    run to the 15-fold gate, which they met. A candidate that was screened on 5 folds and not continued, or not run (CYP2D6), has no verdict: the report does not call it NOT MET, and
    the smallest gain that a 5-fold screen can certify is about one and a half times the smallest gain of the 15-fold design (see the design-floor figure). CYP2D6 was left out of the
    whole Chemprop design by a decision of 2026-10-16, taken before any CheMeleon measurement and confirmed on 2026-10-22: plain Chemprop is at chance on CYP2D6 (outer AUC 0.54 and 0.53)
    while the frozen CheMeleon block reaches 0.63, and the full design costs about 12 days of machine time (about 37 minutes per task, 80 tasks for each variant and enzyme) for a gain that was expected to be small: the first
    estimate of what the fine-tuned network could add, +0.004 to +0.008 AUC, was below the smallest difference of about 0.01 that the design can certify. The decision
    was taken before the result of the OpenADMET weights on CYP3A4 was known, so that whether they help on CYP2D6 is untested and not answered. The code and the weight files are in
    the repository.
- id: L13
  area: data
  uses: []
  text: >-
    The positive rate of the scored test set was recovered from the public leaderboards, which publish accuracy, precision and recall for every prediction file; the three numbers
    fix the rate (the implied rate agrees across all entries). It is aggregate information about the hidden labels that was available because the boards publish it: it weights the
    evaluation yardstick (the test prevalence) and sets the call rate (a multiple of the prevalence). No label of any compound and no per-compound information from a board was used,
    and no submission was made to probe a label. A model without this step would call the positive rate of the training data (about one fifth for both enzymes) instead of about
    one third (CYP3A4) and one in seventeen (CYP2D6), which costs MCC mostly on CYP2D6.
- id: L14
  area: candidates
  uses: [block_ensemble_coverage_pct, block_ensemble_copies, wide_ensemble_coverage_pct]
  text: >-
    The pocket block and the site model were tested with a conformer ensemble of 12 conformers within 5 kcal/mol of the lowest, which holds a member within 1.0 A of the crystal pose
    for only {block_ensemble_coverage_pct}% of {block_ensemble_copies} crystal ligand copies; 300 conformers do so for {wide_ensemble_coverage_pct}%. Their negative verdicts are those of
    models that mostly did not see the bound conformation of the ligand. A wider ensemble was not tried.
