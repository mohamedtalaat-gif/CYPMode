name: Pages

# Publishes the interactive explorer (a marimo notebook exported to a page that runs in the browser) and, once they are in the repository, the interactive card and the public edition of the notebook. GitHub removes scripts from a README,
# so the interactive figures live on these pages. The workflow does nothing until Pages is enabled with the source "GitHub Actions" in the settings of the repository.
"on":
  push:
    branches: [main]
    paths: ["explorer/**", "docs/card/interactive/**", "docs/map/**", "docs/brand/**", "docs/video/cypmode_overview_web.mp4", "docs/video/cypmode_overview_poster.png", "notebooks/public/**", "notebooks/web/**", "notebooks/cypmode_notebook.html", "environment/requirements-lock-marimo.txt", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the pinned explorer environment
        run: pip install -r environment/requirements-lock-marimo.txt

      - name: Export the explorer
        run: |
          mkdir -p site/explorer
          marimo export html-wasm explorer/cypmode_explorer.py -o site/explorer --mode run
          find site/explorer -maxdepth 1 -name '*.md' -delete

      - name: Add the interactive card when it is in the repository
        run: |
          if [ -f docs/card/interactive/full/index.html ]; then mkdir -p site/card && cp docs/card/interactive/full/index.html site/card/index.html;
          elif [ -f docs/card/interactive/index.html ]; then mkdir -p site/card && cp docs/card/interactive/index.html site/card/index.html; fi

      - name: Add the interactive map of the project
        run: |
          if [ -f docs/map/explorer.html ]; then mkdir -p site/map && cp docs/map/explorer.html site/map/index.html; fi

      - name: Add the notebook (the web edition with its figures, and the complete page of one file beside it; the public edition before the complete one is in the repository)
        run: |
          if [ -f notebooks/web/index.html ]; then
            mkdir -p site/notebook/figures
            cp notebooks/web/index.html site/notebook/index.html
            while read -r id; do
              for theme in light dark; do cp docs/figures/*/"$id-$theme.png" site/notebook/figures/; done
            done < notebooks/web/figures.txt
            if [ -f notebooks/cypmode_notebook.html ]; then mkdir -p site/notebook/standalone && cp notebooks/cypmode_notebook.html site/notebook/standalone/index.html; fi
          elif [ -f notebooks/cypmode_notebook.html ]; then mkdir -p site/notebook && cp notebooks/cypmode_notebook.html site/notebook/index.html;
          elif [ -f notebooks/public/cypmode_notebook_public.html ]; then mkdir -p site/notebook && cp notebooks/public/cypmode_notebook_public.html site/notebook/index.html; fi

      - name: Add the film, which the viewer of GitHub does not play because of its size
        run: |
          if [ -f docs/video/cypmode_overview_web.mp4 ]; then
            mkdir -p site/film
            cp docs/video/cypmode_overview_web.mp4 site/film/
            cp docs/video/cypmode_overview_poster.png site/film/poster.png
            python - <<'PY'
          import pathlib
          pathlib.Path("site/film/index.html").write_text("""<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>CYPMode film</title>
          <style>:root{color-scheme:light dark}body{margin:0;font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
          main{width:min(100%,1100px)}video{width:100%;height:auto;border-radius:6px;background:#000}p{margin:12px 0 0}a{color:inherit}</style></head>
          <body><main>
          <video controls preload="metadata" poster="poster.png" src="cypmode_overview_web.mp4"></video>
          <p>The film of the project, 6.5 minutes. <a href="cypmode_overview_web.mp4" download>Download the file</a> (H.264, 31 MB) or <a href="https://github.com/mohamedtalaat-gif/CYPMode">go back to the repository</a>.</p>
          </main></body></html>
          """, encoding="utf-8")
          PY
          fi

      - name: Put the icon of the site on every page and at the root of the site
        run: |
          cp docs/brand/favicon-32.png docs/brand/apple-touch-icon.png docs/brand/favicon.ico site/
          python - <<'PY'
          import base64, pathlib, re
          encode = lambda name: base64.b64encode(pathlib.Path("docs/brand", name).read_bytes()).decode()
          tags = (f'<link rel="icon" type="image/png" sizes="32x32" href="data:image/png;base64,{encode("favicon-32.png")}">'
                  f'<link rel="apple-touch-icon" href="data:image/png;base64,{encode("apple-touch-icon.png")}">')
          for page in pathlib.Path("site").rglob("*.html"):
              text = page.read_text(encoding="utf-8")
              text = re.sub(r'<link[^>]*rel="(?:shortcut )?(?:icon|apple-touch-icon)"[^>]*>', "", text)
              head = re.search(r"<head[^>]*>", text)
              if head:
                  page.write_text(text[: head.end()] + tags + text[head.end():], encoding="utf-8")
                  print("icon added to", page)
          PY

      - name: Keep Jekyll away from the pages
        run: touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
