name: Feature request
description: Suggest a new motif, isoform, or capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is missing
      description: What you are trying to do that the project does not currently support.
    validations:
      required: true
  - type: textarea
    id: citation
    attributes:
      label: Source / methodology
      description: >
        If this is a new motif or structural alert, a paper or named method
        it is based on, see the conventions on citable sources in the Contributing section of README.md.
    validations:
      required: false
